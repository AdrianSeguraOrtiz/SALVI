[project]
name = "salvi-experiments"
version = "0.1.0"
description = "Dataset and benchmark experiment infrastructure for SALVI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Adrian Segura" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2,<2.5",
  "pyarrow>=16,<22",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "salvi==0.1.0",
  "scipy>=1.14,<2",
]

[project.scripts]
salvi-exp = "salvi_experiments.cli:main"

[project.entry-points."salvi.web.providers"]
experiments = "salvi_experiments.web_provider:create_provider"

[project.urls]
Documentation = "https://github.com/AdrianSeguraOrtiz/SALVI/tree/main/docs"
Issues = "https://github.com/AdrianSeguraOrtiz/SALVI/issues"
Repository = "https://github.com/AdrianSeguraOrtiz/SALVI"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salvi_experiments"]
