[project]
name = "salvi"
version = "0.1.0"
description = "Component-oriented quality-diversity biclustering"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Adrian Segura" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=2,<2.5",
  "pyarrow>=16,<22",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
evolution = ["pymoo>=0.6.2,<0.7"]
gui = [
  "fastapi>=0.115,<0.116",
  "platformdirs>=4.3,<5",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<0.35",
]

[project.scripts]
salvi = "salvi.cli.main:main"

[project.urls]
Documentation = "https://github.com/AdrianSeguraOrtiz/SALVI/tree/main/docs"
Issues = "https://github.com/AdrianSeguraOrtiz/SALVI/issues"
Repository = "https://github.com/AdrianSeguraOrtiz/SALVI"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salvi"]
