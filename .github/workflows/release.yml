name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/salvi/web-ui/package-lock.json
      - run: uv sync --all-packages --all-extras --dev --locked
      - run: npm ci
        working-directory: packages/salvi/web-ui
      - run: npm run typecheck
        working-directory: packages/salvi/web-ui
      - run: npm run lint
        working-directory: packages/salvi/web-ui
      - run: npm test
        working-directory: packages/salvi/web-ui
      - run: npm run build
        working-directory: packages/salvi/web-ui
      - run: git diff --exit-code -- packages/salvi/src/salvi/web/static
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov
      - run: uv run python tools/check_release_versions.py --tag "${{ github.ref_name }}"
      - run: uv run python tools/verify_reproducible_builds.py
      - run: uv build --all-packages --out-dir dist --clear --no-create-gitignore
        env:
          SOURCE_DATE_EPOCH: "1704067200"
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: salvi-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
