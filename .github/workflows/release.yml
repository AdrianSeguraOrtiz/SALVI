name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/salvi/web-ui/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
        working-directory: packages/salvi/web-ui
      - run: npm run typecheck
        working-directory: packages/salvi/web-ui
      - run: npm run lint
        working-directory: packages/salvi/web-ui
      - run: npm test
        working-directory: packages/salvi/web-ui
      - run: npm run build
        working-directory: packages/salvi/web-ui
      - run: git diff --exit-code -- packages/salvi/src/salvi/web/static
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest --cov
      - run: python tools/check_release_versions.py --tag "${{ github.ref_name }}"
      - run: python tools/verify_reproducible_builds.py
      - run: python -m build --outdir dist
        env:
          SOURCE_DATE_EPOCH: "1704067200"
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: salvi-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
