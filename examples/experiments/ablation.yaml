schema_version: 1
identifier: example-salvi-ablation
benchmark_root: ../example-dataset

datasets:
  replicates: ALL
  identifiers: [example-dataset]

# GROUND_TRUTH binds only the allowed pattern families for each synthetic
# dataset. It never exposes target count, location, or size to the search.
pattern_binding: GROUND_TRUTH

pipelines:
  - identifier: baseline
    pipeline_configuration: ../smoke-configuration.yaml
  - identifier: repeated-baseline
    pipeline_configuration: ../smoke-configuration.yaml

paired_comparisons:
  - baseline_pipeline: baseline
    compared_pipeline: repeated-baseline

# These are independent SALVI random seeds. Dataset replicate filters above
# refer instead to suffixes such as _101 and _102 in benchmark identifiers.
run_seeds: [7]

task:
  included_patterns: [CONSTANT, ADDITIVE, MULTIPLICATIVE]

metrics:
  artifacts: [SEARCH, FINAL]
  coverage_thresholds: [0.25, 0.5, 0.75]
  case_uncertainty:
    bootstrap_samples: 0
    confidence_level: 0.95
    seed: 0
  aggregate_uncertainty:
    bootstrap_samples: 2000
    confidence_level: 0.95
    seed: 0
  structural_row_weight: 0.5
  diversity_sample_size: 1000
  # Aggregate stochastic seeds within each dataset before paired inference.
  paired_analysis_unit: DATASET
  paired_seed_aggregation: MEAN

execution:
  workers: 1
  allow_nested_parallelism: false
  allow_cpu_oversubscription: false
  resume: true
  retry_failed: false
  fail_fast: false

output_directory: ../../experiment-results/example-ablation
